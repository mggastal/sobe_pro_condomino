name: Atualizar Dashboard Pró Condomíno

on:
  schedule:
    # Horários em UTC. Brasil = UTC-3.
    - cron: '0 9 * * *'    # 06:00 BRT
    - cron: '0 14 * * *'   # 11:00 BRT
    - cron: '0 19 * * *'   # 16:00 BRT
    - cron: '0 0 * * *'    # 21:00 BRT
  workflow_dispatch:        # permite rodar na mão pelo botão "Run workflow"

# Impede duas execuções simultâneas brigando pelo mesmo push
concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: pip install pandas requests

      - name: Gerar data.json (CTBA + João Pessoa)
        run: python dashboard.py

      - name: Forçar deploy do GitHub Pages
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_build

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json .last_build imgs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada mudou — sem commit."
            exit 0
          fi
          git commit -m "Atualiza dados do dashboard — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
